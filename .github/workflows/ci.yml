name: NV foundation
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './engine[test]' -e './services/api[test]'
      - run: python -m pytest engine/tests services/api/tests
      - run: python tools/verify_migration.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nv-visualize
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nv-visualize/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
