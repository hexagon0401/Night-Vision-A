name: NV foundation
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './engine[test,storage,collect]' -e './services/api[test]'
      - run: python -m pytest engine/tests services/api/tests
      - run: python tools/verify_migration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend/nv-visualize
      - run: python tools/generate_contracts.py --check
      - run: python tools/generate_map_demo.py --check
      - run: python tools/verify_geography.py
      - run: python tools/build_demo_exports.py --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nv-visualize
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nv-visualize/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
