[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nv-engine"
version = "2.0.0"
description = "Night Vision intelligence engine foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nv-engine = "nv_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
